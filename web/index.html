  <body class="font-sans antialiased bg-surface-base">
    <!-- lamejs : MP3 encoder for the local-track upload 30s segment picker
         (`UploadTrack.vue` parity; Blade loads the same build from jsdelivr). -->
    <script src="/js/lame.all.js" defer></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js')
            .then((reg) => {
              // Poll for a new deploy so long-lived sessions pick it up.
              setInterval(() => reg.update().catch(() => {}), 5 * 60 * 1000);
            })
            .catch(() => {});
          // The worker skipWaiting+claims clients on install: when control
          // changes, a new version is live -> reload to run fresh code.
          let reloaded = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (reloaded) return;
            reloaded = true;
            location.reload();
          });
        });
      }
    </script>
