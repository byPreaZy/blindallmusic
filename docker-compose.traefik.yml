# Prod override: TLS terminated by the host's Traefik instance.
# Requires the external `traefik` network and ACME resolver `customresolver`
# configured on the host (exposedByDefault=false → labels are mandatory).
#
#   docker compose --env-file .env.production \
#       -f docker-compose.yml -f docker-compose.prod.yml \
#       -f docker-compose.traefik.yml up -d
name: blindall

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  server:
    image: blindall:latest   # pre-built image loaded by CI (docker load)
    logging: *default-logging
    restart: always
    networks:
      - default
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.blindall.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.blindall.entrypoints=websecure
      - traefik.http.routers.blindall.tls=true
      - traefik.http.routers.blindall.tls.certresolver=customresolver
      - traefik.http.routers.blindall.priority=1
      - traefik.http.routers.blindall.middlewares=blindall-secure-headers@docker
      - traefik.http.services.blindall.loadbalancer.server.port=8080
      - traefik.http.middlewares.blindall-secure-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.blindall-secure-headers.headers.frameDeny=true
      - traefik.http.middlewares.blindall-secure-headers.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.blindall-secure-headers.headers.permissionsPolicy=camera=(), microphone=(self), geolocation=()
      - traefik.http.middlewares.blindall-secure-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.blindall-secure-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.blindall-secure-headers.headers.stsPreload=true

  db:
    restart: always

  redis:
    restart: always

  # pg_dump @daily + rotation daily(14)/weekly(8)/monthly(6) into ./backups.
  # Free, zero external deps. Restore: zcat backup.sql.gz | psql
  backup:
    image: prodrigestivill/postgres-backup-local:17
    logging: *default-logging
    restart: always
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_ON_START: "TRUE"
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-8}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
      HEALTHCHECK_PORT: 8081

  # Static site for the root domain (${ROOT_DOMAIN}) — AdSense/Search Console
  # verification requires the parent domain to serve the site markers.
  # `docker compose --env-file .env.production -f docker-compose.traefik.yml --profile rootverify up -d`
  rootverify:
    image: nginx:1-alpine
    logging: *default-logging
    restart: always
    profiles: [rootverify]
    volumes:
      - ./rootverify:/usr/share/nginx/html:ro
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.blindall-rootverify.rule=Host(`${ROOT_DOMAIN:-clerely.fr}`)
      - traefik.http.routers.blindall-rootverify.entrypoints=websecure
      - traefik.http.routers.blindall-rootverify.tls=true
      - traefik.http.routers.blindall-rootverify.tls.certresolver=customresolver
      - traefik.http.services.blindall-rootverify.loadbalancer.server.port=80

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
