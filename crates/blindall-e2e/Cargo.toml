[package]
name = "blindall-e2e"
version = "0.1.0"
edition.workspace = true
description = "Black-box HTTP parity suite : hits a running blindall-server (TEST_BASE_URL, default http://localhost:8080). DB-agnostic: the same suite runs against the MySQL and the Postgres/Supabase backends."
publish = false

[dependencies]
blindall-core = { path = "../blindall-core" }
reqwest.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
uuid.workspace = true
futures.workspace = true
bcrypt.workspace = true
once_cell.workspace = true
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
