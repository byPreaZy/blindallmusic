name: Deploy

# Push sur main -> tag semver auto (conventional commits), build de l'image
# avec la version du tag, release GitHub, transfert `docker save | ssh docker
# load` vers le VPS, puis `compose up`.
#
# La version du tag est injectée via BUILD_VERSION -> APP_VERSION ->
# /api/v1/version -> footer de l'app et cache-busting du service worker.
#
# Ordre volontaire : le tag n'est publié qu'après un build réussi, pour ne
# jamais consommer un numéro de version sur un build cassé.
#
# Secrets requis (repo Settings -> Secrets -> Actions) :
#   VPS_HOST, VPS_USER, VPS_SSH_KEY, ENV_PRODUCTION (contenu de .env.production)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: v
          default_bump: patch
          release_branches: main
          create_annotated_tag: false
          dry_run: true

      - name: Resolved build version
        id: build_version
        run: |
          tag="${{ steps.tag_version.outputs.new_tag }}"
          echo "value=${tag:-${GITHUB_SHA::8}}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: blindall:latest
          build-args: |
            BUILD_VERSION=${{ steps.build_version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag release
        if: steps.tag_version.outputs.new_tag != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.tag_version.outputs.new_tag }}"
          git push origin "${{ steps.tag_version.outputs.new_tag }}"

      - name: GitHub release
        if: steps.tag_version.outputs.new_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: ${{ steps.tag_version.outputs.new_tag }}
          generate_release_notes: true

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes $VPS_USER@$VPS_HOST"
          SCP="scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes"

          $SSH "mkdir -p ~/blindall"
          $SCP docker-compose.yml docker-compose.prod.yml docker-compose.traefik.yml \
               "$VPS_USER@$VPS_HOST:~/blindall/"
          $SCP -r rootverify "$VPS_USER@$VPS_HOST:~/blindall/"

          # .env.production : seed seulement si absent (les secrets vivent sur
          # le VPS / dans le secret GitHub, pas dans le repo)
          printf '%s' "$ENV_PRODUCTION" | $SSH \
            "test -f ~/blindall/.env.production || cat > ~/blindall/.env.production"

          docker save blindall:latest | gzip | $SSH "docker load"

          $SSH "cd ~/blindall && \
            docker compose --env-file .env.production \
              -f docker-compose.yml -f docker-compose.prod.yml \
              -f docker-compose.traefik.yml up -d --remove-orphans && \
            docker image prune -f"
