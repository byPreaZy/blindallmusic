name: blindall

services:

  server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-your-super-secret-and-long-postgres-password}@db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}
      REDIS_URL: redis://redis:6379
      BIND: 0.0.0.0:8080
      SPA_DIR: /app/web/dist
      STORAGE_ROOT: /app/storage
      STORAGE_PUBLIC_PREFIX: /storage
      STORAGE_DISK: ${STORAGE_DISK:-local}
      STORAGE_UPSTREAM_URL: ${STORAGE_UPSTREAM_URL:-}
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_LOCALE: ${APP_LOCALE:-fr}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-base64:YmxpbmVzdC1sb2NhbC1kZXYta2V5LWRvLW5vdC11c2UtaW4tcHJvZA==}
      CACHE_PREFIX: ${CACHE_PREFIX:-blindall_cache_}
      SEED_DEMO: ${SEED_DEMO:-1}
      HIDDEN_CATEGORY_IDS: ${HIDDEN_CATEGORY_IDS:-}
      AUDIUS_APP_NAME: ${AUDIUS_APP_NAME:-blindall}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_MARKET: ${SPOTIFY_MARKET:-FR}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@blindall.test}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Blind'All Music}
      STRIPE_DONATION_URL: ${STRIPE_DONATION_URL:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      DONATIONS_MONTHLY_GOAL_CENTS: ${DONATIONS_MONTHLY_GOAL_CENTS:-15000}
      ADSENSE_CLIENT_ID: ${ADSENSE_CLIENT_ID:-}
      ADSENSE_SLOT: ${ADSENSE_SLOT:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/callback/google}
      DISCORD_APP_ID: ${DISCORD_APP_ID:-}
      DISCORD_APP_SECRET: ${DISCORD_APP_SECRET:-}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-http://localhost:8080/callback/discord}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - storage_data:/app/storage

  # Ephemeral public URL for demos: `docker compose --profile tunnel up -d`
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://server:8080
    depends_on:
      server:
        condition: service_started

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    volumes:
      - ./volumes/db/data:/var/lib/postgresql/data:Z
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: ${POSTGRES_PORT:-5432}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      PGPASSWORD: ${POSTGRES_PASSWORD:-your-super-secret-and-long-postgres-password}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your-super-secret-and-long-postgres-password}
      PGDATABASE: ${POSTGRES_DB:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      JWT_EXP: ${JWT_EXPIRY:-3600}
    # Host port for direct psql/dev access (app uses db:5432 internally).
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-5433}:5432"
    command:
      [
        "postgres",
        "-c",
        "config_file=/etc/postgresql/postgresql.conf",
        "-c",
        "log_min_messages=fatal",
        "-c",
        "log_min_duration_statement=${PG_SLOW_QUERY_MS:-300}"
      ]

volumes:
  redis_data:
  storage_data:
  db-config:
